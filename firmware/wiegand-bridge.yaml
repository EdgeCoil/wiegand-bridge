# SPDX-License-Identifier: MIT
# edgecoil wiegand-bridge -- ESPHome config for the revision 10 board (hardware/).
#
# Written for the rev 12 board. The tested build ran on rev 10, where IO47 (the green OK LED since
# rev 11) goes only to the unfitted J6, so driving it is harmless; rev 10 and 11 boards read the reader
# supply and current on IO2/IO9 instead of the rev 12 INA226, so on those the ina226 sensor reports
# nothing found. Work through docs/design.md *Bench tests* first.
# The OLED is an optional package (wiegand-bridge-oled.yaml): include it once a screen is fitted.
#
# THIS DEVICE ONLY REPORTS. There is no relay output defined: credentials go to Home Assistant as
# events, HA decides, and any unlock happens elsewhere, through whatever actuator HA already controls.
# A reader-side board usually sits where anyone can reach it -- read docs/design.md *Security*:
# an isolated IoT network, HA's "allow device actions" OFF, a device_id check, a tamper alert.
#
# Secrets (secrets.yaml): wifi_ssid, wifi_password, wiegand_bridge_api_key, wiegand_bridge_ota_password.

substitutions:
  name: wiegand-bridge
  friendly_name: Wiegand bridge
  # Reader monitor zero (mA): what U12 reads with the reader switch on and NO reader connected -- U13's
  # operating current (<= 0.48 mA) plus its UVLO divider (~12 uA). 0.25 is mid-range (+-0.25 mA
  # uncalibrated); measure it once per board for better (docs/design.md, Bench tests 4).
  reader_zero_ma: "0.25"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# Saved values (the reader shed state) reach flash within 5 s of a change, not 60 s. Writes happen only
# on change, and sheds are rare (audit round 13, S2).
preferences:
  flash_write_interval: 5s

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: quad                     # N8R2. NOT octal -- the wrong mode fails at runtime
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret wiegand_bridge_api_key
  actions:
    - action: feedback_granted
      then:
        - logger.log:            # INFO, so a caller can confirm the action ran (no credential in it)
            level: INFO
            format: "feedback: granted"
        - lambda: 'id(screen_text) = "Granted";'
        - script.execute: screen_wake
        # Three green pulses, then green held 3 s. On most readers the LED line is a level input:
        # pulled low = green. Not every reader wires BEEP; it is kept for those that do.
        - output.turn_on: reader_beep
        - repeat:
            count: 3
            then:
              - output.turn_on: reader_led
              - delay: 300ms
              - output.turn_off: reader_led
              - delay: 200ms
              - output.turn_off: reader_beep
        - output.turn_on: reader_led
        - delay: 3s
        - output.turn_off: reader_led
    - action: feedback_denied
      then:
        - logger.log:
            level: INFO
            format: "feedback: denied"
        - lambda: 'id(screen_text) = "Denied";'
        - script.execute: screen_wake
        - repeat:
            count: 3
            then:
              - output.turn_on: reader_beep
              - delay: 100ms
              - output.turn_off: reader_beep
              - delay: 100ms

ota:
  - platform: esphome
    password: !secret wiegand_bridge_ota_password

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # rev 10: UART0 (IO43/44) is the RS-485 port
  # NEVER raise to DEBUG in service: debug logs the Wiegand frames, i.e. the codes.

i2c:
  - id: bus_a
    sda: GPIO41
    scl: GPIO42

# rev 10: TCA9535 at 0x20 (register-compatible with PCA9555 -> the pca9554 component, 16 pins).
# P00 relay drive (spare boards only -- deliberately NOT defined on the door unit), P01 CHRG,
# P02 DONE, P03 external power, P04 5 V power-good, P05 W5500 reset, P06-P17 to the 2x6 header.
pca9554:
  - id: io_exp
    i2c_id: bus_a
    address: 0x20
    pin_count: 16

# rev 10: RS-485 / OSDP port on UART0 (THVD1420 since rev 12, SP3485 before; DE on IO38). No OSDP component exists in ESPHome
# yet; the UART is declared so the pins are claimed and the port can be bench-tested.
uart:
  - id: rs485
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 9600

wiegand:
  - id: reader
    d0: GPIO4                    # via U4 74LVC2G17
    d1: GPIO5
    on_key:                      # keys reach pin_input through its source_id, AFTER this trigger runs
      then:
        - script.execute: screen_wake
        # On many keypads the bell key IS '#' (11). '#' with no digits typed rings the doorbell;
        # '#' after 1-3 digits clears the entry, because key_collector keeps a too-short entry
        # (so "12#3456#" would otherwise submit 123456). 4+ digits: key_collector submits it.
        - lambda: |-
            const uint32_t now = millis();
            if (now - id(last_key_ms) > 10000) id(digits_typed) = 0;   // mirrors pin_input's timeout
            id(last_key_ms) = now;
            if (x <= 9) {
              id(digits_typed)++;
            } else if (x == 10) {                                      // '*'
              id(digits_typed) = 0;
            } else if (x == 11) {                                      // '#'
              if (id(digits_typed) >= 4) {
                id(last_submit_ms) = now;
              } else if (id(digits_typed) > 0) {
                id(pin_input).clear();
              } else if (now - id(last_submit_ms) > 2000) {            // a habitual second '#' is not a ring
                id(doorbell).trigger("ring");
              }
              id(digits_typed) = 0;
            }
    on_tag:
      then:
        - script.execute: screen_wake
        - homeassistant.event:
            event: esphome.wiegand_bridge
            data:
              type: fob
              value: !lambda "return x;"

key_collector:
  - id: pin_input
    source_id: reader
    min_length: 4
    max_length: 10
    end_keys: "#"
    end_key_required: true
    clear_keys: "*"
    timeout: 10s
    # Masked live entry: one '*' per digit typed, empty on clear/timeout/submit. NEVER the digits --
    # this is an entity, so once adopted it lands in HA's history.
    on_progress:
      then:
        - text_sensor.template.publish:
            id: entry_progress
            state: !lambda "return std::string(x.size(), '*');"
    on_result:
      then:
        - homeassistant.event:
            event: esphome.wiegand_bridge
            data:
              type: code
              value: !lambda "return x.c_str();"

output:
  # Spare expander pin P17 has no pull-down on the board (it could not be routed): declared as an
  # output (default off = low) so it is never a floating input. P06-P16 are tied low by RN1-RN3.
  - platform: gpio
    id: exp_p17_tie_low
    pin: {pca9554: io_exp, number: 15}
  - platform: gpio
    id: reader_led
    pin: GPIO6                   # Q1 -> J11 LED (confirm polarity on the bench)
  - platform: gpio
    id: reader_beep
    pin: GPIO40                  # Q2 -> J11 BEEP (rev 10: moved from IO7, which could not be routed out)
  - platform: gpio
    id: reader_shed
    pin: GPIO48                  # IO48 drives Q4, which pulls U13's SHDN low; turn_on
                                 # drives it high = shed. R18 holds Q4 off (reader on) through reset and boot.
  - platform: gpio
    id: status_ok_led
    pin:
      number: GPIO47
      inverted: true             # rev 11: D23 green OK sinks into the pin (rev 10: J6 RST, not fitted)

# Status pair (rev 11): red FAULT = ESPHome's status LED (slow blink warning, fast blink error);
# green OK = steady while a client (Home Assistant) is connected to the API.
interval:
  - interval: 1s                  # the reader shed policy is level-triggered: re-check it every second
    then:
      - script.execute: reader_supply_policy
  - interval: 1s
    then:
      - if:
          condition:
            api.connected:
          then:
            - output.turn_on: status_ok_led
          else:
            - output.turn_off: status_ok_led



light:
  - platform: status_led
    name: "${friendly_name} status"
    pin:
      number: GPIO21
      inverted: true             # D8 sinks into the pin (red FAULT since rev 11; yellow on rev 10)

binary_sensor:
  - platform: status
    name: "${friendly_name} online"
  - platform: gpio
    name: "${friendly_name} tamper"
    device_class: tamper
    pin:
      number: GPIO8              # lid on = SW3 closed = low
    filters:
      - delayed_on: 200ms
  - platform: gpio
    id: ext_power
    name: "${friendly_name} external power"
    device_class: power
    pin: {pca9554: io_exp, number: 3}       # +5V divider, ~2.8 V when present (rev 10: via the expander)
    on_state:
      - script.execute: reader_supply_policy
  # U13 FLT (TPS26625, open drain, R97 pull-up, to IO9): low on overload, thermal shutdown, UVLO,
  # reverse current, while shed, and through its slow start (up to ~0.7 s with the power-good deglitch).
  # No open-load indication. The eFuse retries by itself; this only reports. A reader plugged into a
  # live terminal holds the limit for up to ~30 ms. The 1 s filter covers both.
  - platform: gpio
    id: reader_fault
    name: "${friendly_name} reader supply fault"
    device_class: problem
    entity_category: diagnostic
    pin:
      number: GPIO9
      inverted: true
    filters:
      - delayed_on: 1s
    on_press:
      - component.update: reader_monitor     # fresh reader-terminal voltage for reader_overload
  # Overload or short at J3/J21: FLT with the reader terminal low, and not a low-battery shed (which
  # also holds FLT low with the terminal at 0 V). On battery a fault draws from the cell near the
  # protection's limit (docs/design.md, Reader supply), so shed the reader until external power
  # returns rather than let the eFuse retry.
  - platform: template
    id: reader_overload
    name: "${friendly_name} reader supply overload"
    device_class: problem
    # (millis() - reader_released_ms) masks U13's restart after a shed ends: FLT stays low for up to
    # ~0.7 s (ramp plus power-good deglitch) while reader_v still holds the shed's 0 V.
    lambda: |-
      return id(reader_fault).state && id(reader_shed_state) != 2 &&
             millis() - id(reader_released_ms) > 1500 &&
             !isnan(id(reader_v).state) && id(reader_v).state < 9.0f;
    on_press:
      - script.execute: reader_supply_policy
  - platform: gpio
    name: "${friendly_name} battery charging"
    device_class: battery_charging
    pin: {pca9554: io_exp, number: 1, inverted: true}   # CN3058E CHRG, open drain, low = charging
  - platform: gpio
    name: "${friendly_name} battery charged"
    pin: {pca9554: io_exp, number: 2, inverted: true}   # CN3058E DONE, low = full
  - platform: gpio
    name: "${friendly_name} 5 V supply OK"
    device_class: power
    entity_category: diagnostic
    pin: {pca9554: io_exp, number: 4}       # LMR16020 PGOOD
  - platform: gpio
    name: "${friendly_name} input 1"
    pin: {number: GPIO15, inverted: true}
    filters: [delayed_on_off: 30ms]
  - platform: gpio
    name: "${friendly_name} input 2"
    pin: {number: GPIO16, inverted: true}
    filters: [delayed_on_off: 30ms]
  - platform: gpio
    name: "${friendly_name} input 3"
    pin: {number: GPIO17, inverted: true}
    filters: [delayed_on_off: 30ms]
  - platform: gpio
    name: "${friendly_name} input 4"
    pin: {number: GPIO18, inverted: true}
    filters: [delayed_on_off: 30ms]

sensor:
  - platform: wifi_signal
    name: "${friendly_name} RSSI"
    update_interval: 300s
  # rev 12: reader monitor U12 INA226 (0x40), 0.1 ohm shunt between the boost and the reader switch
  # U13; its bus voltage is the reader terminal (after F1, through 4.7k), so a tripped F1 or a switch in
  # its current limit reads as a low supply, not a missing reader. 0x40 is also the default of several
  # Qwiic parts (HTU21D, Si7021, HDC1080, PCA9685): don't add one of those on J18 without moving it.
  - platform: ina226
    id: reader_monitor
    i2c_id: bus_a
    address: 0x40
    shunt_resistance: 0.1 ohm
    max_current: 0.8A
    adc_averaging: 16
    update_interval: 30s
    current:
      id: reader_i
      name: "${friendly_name} reader current"
      unit_of_measurement: mA
      accuracy_decimals: 1
      filters:
        - multiply: 1000
        # the shunt also carries U13's operating current and its UVLO divider (reader_zero_ma, measured
        # per board). For better than ~1.5 % of reading, add a measured `- multiply:` here from one
        # bench point (docs/design.md, Bench tests 4).
        - offset: -${reader_zero_ma}
        # shed, the shunt carries only U13's shutdown current and the divider, so the offset alone would read below 0
        - clamp:
            min_value: 0
    bus_voltage:
      id: reader_v
      name: "${friendly_name} reader supply"
  - platform: adc
    id: battery_v
    pin: GPIO1
    name: "${friendly_name} battery"
    attenuation: 12db
    filters:
      - multiply: 2.0
    update_interval: 60s
    on_value:
      - script.execute: reader_supply_policy

  # Battery thermistor (rev 10, 2026-10-11): U5's TEMP divider (R77 5.1k from +5V, R78 68k, a 10k
  # B3950 NTC on the cell at J4 pins 3-4, or RT1 via JP5) read through R79/R80 (2/3) on IO3.
  # The divider is fed from +5V, so it only reads while external power is present.
  - platform: adc
    id: bat_temp_adc
    pin: {number: GPIO3, ignore_strapping_warning: true}   # IO3 strap only matters with JTAG eFuses burnt
    attenuation: 12db
    internal: true
    update_interval: 60s
  - platform: template
    id: bat_ntc_ohms
    internal: true
    unit_of_measurement: "Ω"
    update_interval: 60s
    lambda: |-
      if (!id(ext_power).state) return NAN;          // divider unpowered on battery
      const float vt = id(bat_temp_adc).state * 1.5f; // undo R79/R80
      const float v5 = 4.7f;                          // +5V after the OR diode, nominal
      if (vt >= v5 * 0.88f) return NAN;               // no thermistor (open reads ~91 %): U5 is not charging
      const float rx = 5100.0f * vt / (v5 - vt);      // R77
      const float g = 1.0f / rx - 1.0f / 68000.0f - 1.0f / 300000.0f;   // remove R78 and R79+R80
      return g > 0 ? 1.0f / g : NAN;
  - platform: ntc
    sensor: bat_ntc_ohms
    name: "${friendly_name} battery temperature"
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm

globals:
  # Reader shed state, written only by script reader_supply_policy (below): 0 = not shed, 1 = shed for
  # an overload, 2 = shed for a low cell (which holds FLT low with the terminal at 0 V: not an
  # overload). One value, so flash holds one key and can never pair a stale half with a new one (audit
  # round 13, S1; it was two bools). Kept in flash (audit round 12, S1): a shed must survive a reboot,
  # and with Wi-Fi or HA down in an outage ESPHome reboots every 15 min (reboot_timeout). IO48 comes up
  # low (reader on, by R18/R99), and the policy re-asserts the shed at its first run once the expander
  # has read ext_power. Written within 5 s of a change (preferences, above); an unclean reset (RESET,
  # crash, brownout) inside those 5 s may retry once. Clean reboots save first.
  - id: reader_shed_state
    type: uint8_t
    restore_value: true
    initial_value: '0'
  - id: reader_released_ms        # when a shed last ended; reader_overload ignores the restart after it
    type: uint32_t
    initial_value: '0'
  - id: screen_text
    type: std::string
    initial_value: '"Present card or enter code"'
  - id: screen_awake              # read by wiegand-bridge-oled.yaml; harmless with no screen
    type: bool
    initial_value: 'false'
  - id: digits_typed              # doorbell / short-entry logic in the wiegand on_key
    type: int
    initial_value: '0'
  - id: last_key_ms
    type: uint32_t
    initial_value: '0'
  - id: last_submit_ms
    type: uint32_t
    initial_value: '0'

text_sensor:
  - platform: template
    id: entry_progress
    name: "${friendly_name} entry"
    icon: mdi:dialpad

event:
  - platform: template
    id: doorbell
    name: "${friendly_name} doorbell"
    device_class: doorbell
    event_types: [ring]

# The OLED lives in its own package so a board without one has no FAILED component (which
# blinks the status LED as an error). Uncomment once the SH1106 is on J5.
# packages:
#   oled: !include wiegand-bridge-oled.yaml

script:
  # Reader shed policy (audit round 11: level-triggered; rounds 8-11 found edge-triggered versions that
  # missed an overload already present when external power went, and a low cell after a reboot, since
  # on_value_range restores its last state from flash). It reads the present state, not events, and
  # runs on every relevant change and once a second:
  # - external power present: end any shed (the eFuse may retry; the boost has a supply).
  # - on battery, not shed: shed for a low cell (battery_v < 3.0 V) or for an overload. A shed holds
  #   until external power returns, so a short is not retried from the cell; it is kept in flash and
  #   re-asserted after a reboot (globals, above).
  # The shed output and reader_shed_state change together here and nowhere else.
  - id: reader_supply_policy
    then:
      - lambda: |-
          if (!id(ext_power).has_state()) return;          // expander not read yet (boot)
          uint8_t &st = id(reader_shed_state);              // 0 none, 1 overload, 2 low cell
          if (st > 2) st = 0;                               // unknown value from flash: start clean
          if (id(ext_power).state) {
            if (st != 0) {
              id(reader_shed).turn_off();
              st = 0;
              id(reader_released_ms) = millis();
            }
          } else if (st != 0) {
            id(reader_shed).turn_on();                      // re-assert: IO48 comes up low after a reboot
          } else if (id(battery_v).state < 3.0f) {          // false while NaN (no reading yet)
            st = 2;
            id(reader_shed).turn_on();
          } else if (id(reader_overload).state) {
            st = 1;
            id(reader_shed).turn_on();
          }
  - id: screen_wake
    mode: restart
    then:
      - lambda: id(screen_awake) = true;
      - delay: 60s
      - lambda: |-
          id(screen_text) = "Present card or enter code";
          id(screen_awake) = false;
